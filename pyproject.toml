[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycontacts"
version = "0.0.18"
requires-python = ">=3.14"
authors = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
maintainers = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
description = "Interact with google contacts"
readme = "README.md"
license = "MIT"
keywords=[
    "google",
    "contacts",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httplib2",
    "pygooglehelper",
    "gdata-python3",
    "pytconf",
    "pylogconf",
]

[project.urls]
"Homepage" = "https://github.com/veltzer/pycontacts"
"Bug Tracker" = "https://github.com/veltzer/pycontacts/issues"
"Documentation" = "https://veltzer.github.io/pycontacts"
"Download" = "https://pypi.org/project/pycontacts/"
"Repository" = "https://github.com/veltzer/pycontacts"

[project.scripts]
pycontacts = "pycontacts.main:main"

[tool.ruff]
line-length = 130

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pycontacts"]
# client_secret.json is gitignored (GitHub push protection blocks OAuth
# secrets), but it must ship in the distribution so `pip install pycontacts`
# works with no setup. "artifacts" overrides the VCS-ignore exclusion.
artifacts = ["src/pycontacts/client_secret.json"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/pycontacts/client_secret.json"]
include = [
    "src/pycontacts/",
    "README.md",
    "LICENSE",
    "pyproject.toml"
]
exclude = [
    ".gitignore",
    ".github/",
    "tests/",
    "docs/",
    "config/",
    "*.md",
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
mypy_path = "src:python:scripts"
explicit_package_bases = true
namespace_packages = true

# Third-party libraries without type stubs; `foo.*` also matches `foo` itself.
[[tool.mypy.overrides]]
module = [
    "gdata.*",
    "pygooglehelper.*",
    "pylogconf.*",
    "pytconf.*",
]
ignore_missing_imports = true
[tool.hatch.envs.default]
installer = "uv"

[tool.uv.pip]
prerelease = "disallow"
